<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ContextBridge</title>
  <style>
    body {
      width: 350px;
      min-height: 200px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e5e7eb;
    }
    .title {
      font-size: 18px;
      font-weight: 600;
      color: #111827;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }
    .status-dot.inactive {
      background: #6b7280;
    }
    .project-section {
      margin-bottom: 20px;
    }
    .label {
      font-size: 12px;
      font-weight: 500;
      color: #6b7280;
      margin-bottom: 6px;
    }
    select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      background: white;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      background: #3b82f6;
      color: white;
      margin-bottom: 10px;
    }
    button:hover {
      background: #2563eb;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .site-status {
      text-align: center;
      font-size: 12px;
      color: #6b7280;
      margin-top: 15px;
    }
    .dashboard-link {
      display: block;
      text-align: center;
      color: #3b82f6;
      text-decoration: none;
      font-size: 12px;
      margin-top: 10px;
    }
    .dashboard-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">ContextBridge</div>
    <div class="status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Active</span>
    </div>
  </div>

  <div class="project-section">
    <label for="projectSelect" class="label">Current Project</label>
    <select id="projectSelect" title="Current Project">
      <option value="">Detecting project...</option>
    </select>
  </div>

  <button id="captureProject" class="primary">
    📋 Capture All Project Conversations
  </button>

  <div class="site-status">
    <span id="currentSite">Checking Claude connection...</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
