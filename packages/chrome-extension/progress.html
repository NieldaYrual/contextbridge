<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ContextBridge Capture Progress</title>
  <style>
    body {
      width: 400px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    h2 {
      margin-top: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .progress-bar {
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
      height: 30px;
      overflow: hidden;
      margin: 20px 0;
    }

    .eta-container {
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.3);
      min-height: 20px;
    }

    .progress-fill {
      background: rgba(255,255,255,0.8);
      height: 100%;
      border-radius: 10px;
      transition: width 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      color: #667eea;
    }
    .status-log {
      background: rgba(0,0,0,0.2);
      border-radius: 8px;
      padding: 15px;
      max-height: 300px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.6;
    }
    .status-line {
      margin: 5px 0;
      opacity: 0;
      animation: fadeIn 0.3s forwards;
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    .complete {
      color: #4ade80;
      font-weight: bold;
    }
    .error {
      color: #f87171;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>
    <div class="spinner"></div>
    ContextBridge Capture
  </h2>
  
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill">0%</div>
  </div>

  <div id="etaContainer" class="eta-container"></div>
  
  <div class="status-log" id="statusLog">
    <div class="status-line">🚀 Capture starting...</div>
  </div>
  
  <script src="progress.js"></script>
</body>
</html>
