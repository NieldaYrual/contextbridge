<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capture Progress - ContextBridge</title>
  <style>
    body {
      font-family: system-ui;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    .progress-container {
      background: #f5f5f5;
      border-radius: 10px;
      padding: 30px;
    }
    .progress-bar {
      width: 100%;
      height: 30px;
      background: #e0e0e0;
      border-radius: 15px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      transition: width 0.3s;
      width: 0%;
    }
    .status {
      margin-top: 20px;
      font-size: 18px;
    }
    .current-conversation {
      margin-top: 10px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="progress-container">
    <h2>📊 Capturing Project Conversations</h2>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="status" id="status">Initializing...</div>
    <div class="current-conversation" id="currentConv"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const jobId = params.get('jobId');
    
    if (!jobId) {
      document.getElementById('status').textContent = 'Error: No job ID provided';
      document.getElementById('currentConv').textContent = 'Please provide a valid jobId parameter';
    } else {
      updateProgress();
    }
    
    async function updateProgress() {
      try {
        const response = await fetch(`/api/scraper/status/${jobId}`);
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        
        const data = await response.json();
        
        const progress = data.progress || 0;
        document.getElementById('progressFill').style.width = `${progress}%`;
        document.getElementById('status').textContent = 
          `Status: ${data.status || 'Unknown'} (${progress}%)`;
        
        if (data.status === 'completed') {
          const conversationCount = data.result?.conversationsCaptured || 0;
          document.getElementById('currentConv').textContent = 
            `✅ Captured ${conversationCount} conversations!`;
        } else if (data.status === 'failed') {
          document.getElementById('currentConv').textContent = 
            `❌ Error: ${data.error || 'Unknown error occurred'}`;
        } else if (data.currentConversation) {
          document.getElementById('currentConv').textContent = 
            `Processing: ${data.currentConversation}`;
        }
        
        if (data.status !== 'completed' && data.status !== 'failed') {
          setTimeout(updateProgress, 1000);
        }
      } catch (error) {
        console.error('Failed to update progress:', error);
        document.getElementById('status').textContent = 'Error: Failed to fetch progress';
        document.getElementById('currentConv').textContent = `Connection error: ${error.message}`;
      }
    }
  </script>
</body>
</html>
