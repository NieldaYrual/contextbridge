<!-- packages/backend/src/public/test-websocket.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Hub Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        #messages { 
            border: 1px solid #ccc; 
            height: 300px; 
            overflow-y: auto; 
            padding: 10px; 
            margin-top: 20px;
            background: #f5f5f5;
        }
        button { margin: 5px; padding: 8px 15px; }
        .status { font-weight: bold; margin-bottom: 20px; }
        .connected { color: green; }
        .disconnected { color: red; }
        .message { margin: 5px 0; padding: 5px; background: white; border-radius: 3px; }
    </style>
</head>
<body>
    <h1>WebSocket Hub Test</h1>
    <div class="status">Status: <span id="status" class="disconnected">Disconnected</span></div>
    
    <div>
        <button onclick="connect()">Connect</button>
        <button onclick="joinRoom()">Join Test Room</button>
        <button onclick="sendProgress()">Send Progress Update</button>
        <button onclick="simulateApiHit()">Simulate API Hit</button>
        <button onclick="checkRooms()">Check Active Rooms</button>
    </div>
    
    <div id="messages"></div>

    <script>
        let ws = null;
        const projectId = 'default-project';
        
        function addMessage(msg, type = 'received') {
            const messagesDiv = document.getElementById('messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            msgDiv.innerHTML = `<strong>${type}:</strong> ${JSON.stringify(msg, null, 2)}`;
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        function updateStatus(connected) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = connected ? 'Connected' : 'Disconnected';
            statusEl.className = connected ? 'connected' : 'disconnected';
        }
        
        function connect() {
            if (ws) {
                ws.close();
            }
            
            // Use current host and port for WebSocket connection
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                updateStatus(true);
                addMessage('WebSocket connected', 'system');
            };
            
            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    addMessage(msg, 'received');
                } catch (err) {
                    addMessage(event.data, 'raw');
                }
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                addMessage(`WebSocket error occurred`, 'error');
            };
            
            ws.onclose = () => {
                updateStatus(false);
                addMessage('WebSocket disconnected', 'system');
            };
        }
        
        function joinRoom() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                const msg = {
                    t: 'join',
                    projectId: projectId,
                    role: 'dashboard'
                };
                ws.send(JSON.stringify(msg));
                addMessage(msg, 'sent');
            } else {
                alert('Not connected. Click Connect first.');
            }
        }
        
        function sendProgress() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                const msg = {
                    t: 'progress',
                    projectId: projectId,
                    pct: Math.floor(Math.random() * 100),
                    note: `Test progress at ${new Date().toLocaleTimeString()}`
                };
                ws.send(JSON.stringify(msg));
                addMessage(msg, 'sent');
            } else {
                alert('Not connected. Click Connect first.');
            }
        }
        
        function simulateApiHit() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                const msg = {
                    t: 'api_hit',
                    projectId: projectId,
                    url: '/api/organizations/123/chat_conversations/456',
                    contentType: 'application/json',
                    body: {
                        uuid: 'test-conv-456',
                        name: 'Test Conversation',
                        chat_messages: [
                            { role: 'user', content: 'Test message' },
                            { role: 'assistant', content: 'Test response' }
                        ]
                    }
                };
                ws.send(JSON.stringify(msg));
                addMessage(msg, 'sent');
            } else {
                alert('Not connected or not in room.');
            }
        }
        
        async function checkRooms() {
            try {
                const response = await fetch('/api/ws/rooms');
                const rooms = await response.json();
                addMessage(rooms, 'room info');
            } catch (err) {
                addMessage(`Failed to fetch rooms: ${err}`, 'error');
            }
        }
        
        // Auto-connect on load
        window.addEventListener('load', () => {
            connect();
        });
    </script>
</body>
</html>
